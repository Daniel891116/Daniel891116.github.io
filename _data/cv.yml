- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Advanced Robotics and Controls Lab (ARCLab), UC San Diego — advised by Prof. Michael C. Yip
      year: Oct 2024 - present
      description:
        - "N2D Haptic Glove: designed closed-loop 2-D fingertip force-feedback control and the full teleoperation pipeline for a multi-finger glove driving an Inspire Hand on a Franka arm; in a user study, 2-D feedback achieved the lowest median force-tracking error vs. 1-D and no-force-feedback conditions."
        - "In-hand manipulation of articulated tools (sim-to-real): designed an augmented tactile fingertip structure for the Inspire Hand and built the experimental pipeline quantifying tool steadiness during dexterous in-hand manipulation."
        - "Compliant grasping across dexterous hands: built the joint-torque calibration and teleoperated demonstration-collection pipelines and a unified hand representation with force rendering across embodiments (Inspire, Wuji); raised average task success from 0.44 to 0.71 over a DiT-flow baseline."
    - title: Undergraduate Research Student
      institution: Robot Learning Lab, National Taiwan University — advised by Prof. Shao-Hua Sun
      year: Jul 2022 - Dec 2023
      description:
        - Investigated unsupervised reinforcement learning problems based on SPIRL.
        - Designed experiments showing that learning efficiency slows by 1M steps in the absence of certain skills.
        - Implemented a choice mechanism that lets the high-level agent choose between exploration and exploitation.
    - title: Undergraduate Research Student
      institution: Advanced Control Lab, National Taiwan University — advised by Prof. Li-Chen Fu
      year: Feb 2022 - Jun 2022
      description:
        - Developed a 2-D visual odometry system using optical flow for indoor UAV odometry in GPS-denied environments.

