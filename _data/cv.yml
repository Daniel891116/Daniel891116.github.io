- title: Selected Projects
  type: time_table
  contents:
    - title: Visual-Inertial SLAM (ECE 276A)
      year: Jan 2025 - Mar 2025
      description:
        - Built a stereo pipeline (Shi-Tomasi / optical-flow / RANSAC) with EKF fusion; update time under 50 ms on recorded sequences.
        - Tuned noise models and outlier rejection; achieved ~80% drift reduction vs IMU-only across 3 evaluation runs.
        - Implemented robust keyframe logic to sustain tracking under fast motion.
    - title: Motion Planning Algorithms (ECE 276B)
      year: Apr 2025 - May 2025
      description:
        - Developed Weighted A* and KD-accelerated Connect-RRT planners for 3-D obstacle maps; achieved 26x NN-query speed-up with cKDTree.
        - Across 7 maps, Weighted A* (w=2) ran 23% faster than optimal A* with only 3% longer paths.
        - Comparative study of runtime, memory, and path quality across search-based and sampling-based methods.
    - title: Magic Hand — Real-Time RGB-D Arm-Pose Guided Laser Pointer (2023 MakeNTU)
      year: Apr 2023 - May 2023
      description:
        - Applied YOLOv5 on RGB-D frames from an Intel RealSense camera to localize arm joints and steer a laser pointer in real time.
        - Optimized inference with optical-flow tracking to sustain 60+ FPS on a laptop CPU.
        - Award-winning demo with low-latency pointing and smooth user interaction.

