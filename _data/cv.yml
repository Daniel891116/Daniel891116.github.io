- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Student
      institution: Advanced Robotics and Controls Lab (ARCLab), UC San Diego — advised by Prof. Michael C. Yip
      year: Oct 2024 - present
      description:
        - Built a visuotactile teleoperation and data pipeline connecting a haptic glove, Inspire Hand, and Franka arm with synchronized multimodal sensing and control across simulation and hardware.
        - Trained tactile-conditioned imitation learning policies using LeRobot ACT and Diffusion Policy, improving sample efficiency and task success over vision-only baselines.
        - Implemented closed-loop 2-D force-feedback teleoperation, improving force-tracking accuracy and reducing operator workload in contact-rich manipulation.
        - Built a ROS 2-based motor torque-sensor calibration system for Inspire Hand and Wuji Hand using an ATI load cell for ground-truth measurement and Rerun for visualization and debugging.

